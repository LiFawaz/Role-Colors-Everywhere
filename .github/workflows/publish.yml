name: Publish Valenced plugin repository

on:
  push:
    branches:
      - main
      - fix/valenced-patcher-hooks
  workflow_dispatch:

concurrency:
  group: publish-valenced-repository
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install build dependencies
        run: bun install
      - name: Build plugin bundle
        run: bun --bun run build --plugins-dir plugins role-color-everywhere
      - name: Package and validate plugin
        run: |
          python3 scripts/package_plugin.py role-color-everywhere
          ZIP_PATH="$(python3 - <<'PY'
          import json
          m=json.load(open('plugins/role-color-everywhere/manifest.json'))
          print(f"dist/{m['id']}@{m['version']}.zip")
          PY
          )"
          python3 scripts/check_zip.py "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$(basename "$ZIP_PATH")" >> "$GITHUB_ENV"
      - name: Publish versioned ZIP and generate index.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          POOL_DIR="$RUNNER_TEMP/valenced-pool"
          POOL_REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch gh-pages "$POOL_REMOTE" "$POOL_DIR" 2>/dev/null; then
            echo "Using existing gh-pages pool"
          else
            mkdir -p "$POOL_DIR"
            git -C "$POOL_DIR" init -b gh-pages
            git -C "$POOL_DIR" remote add origin "$POOL_REMOTE"
          fi
          mkdir -p "$POOL_DIR/pool"
          cp "$ZIP_PATH" "$POOL_DIR/pool/$ZIP_NAME"
          bun run generate-index --dist "$POOL_DIR/pool" --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/pool" --out "$POOL_DIR/index.json"
          git -C "$POOL_DIR" config user.name "github-actions[bot]"
          git -C "$POOL_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$POOL_DIR" add pool index.json
          if git -C "$POOL_DIR" diff --cached --quiet; then
            echo "No repository changes to publish"
          else
            git -C "$POOL_DIR" commit -m "Publish Role Color Everywhere"
            git -C "$POOL_DIR" push origin gh-pages
          fi
      - name: Verify published repository
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          cache_buster = os.environ["GITHUB_SHA"]
          url = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/gh-pages/index.json?verify={cache_buster}"
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)
          plugin = data["plugins"]["com.lifawaz.role-color-everywhere"]
          version = plugin["channels"]["latest"]
          artifact = plugin["versions"][version]
          artifact_url = f"{artifact['url']}?verify={cache_buster}"
          with urllib.request.urlopen(artifact_url, timeout=30) as response:
              payload = response.read()
          actual_sha256 = hashlib.sha256(payload).hexdigest()
          actual_size = len(payload)
          assert actual_sha256 == artifact["sha256"], f"ZIP SHA-256 mismatch: {actual_sha256} != {artifact['sha256']}"
          assert actual_size == artifact["size"], f"ZIP size mismatch: {actual_size} != {artifact['size']}"
          print("Published index and ZIP verified:", version, url)
          PY
