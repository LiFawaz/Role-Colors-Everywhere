name: Build plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Build plugin
        run: bun --bun run build --plugins-dir plugins role-color-everywhere
      - name: Package and validate plugin
        run: |
          python3 scripts/package_plugin.py role-color-everywhere
          ZIP_PATH="$(python3 - <<'PY'
          import json
          m=json.load(open('plugins/role-color-everywhere/manifest.json'))
          print(f"dist/{m['id']}@{m['version']}.zip")
          PY
          )"
          python3 scripts/check_zip.py "$ZIP_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: role-color-everywhere-plugin
          path: dist/*.zip
          retention-days: 14
