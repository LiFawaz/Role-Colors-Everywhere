name: Build plugins
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Build plugin
        run: bun --bun run build --plugins-dir plugins role-color-everywhere
      - name: Package plugin
        run: |
          python3 scripts/package_plugin.py role-color-everywhere
          python3 scripts/check_zip.py dist/com.lifawaz.role-color-everywhere@1.0.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: role-color-everywhere-plugin
          path: dist/*.zip
          retention-days: 14
